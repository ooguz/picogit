name: Bug report
description: Something does not work as described in the README
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go to a private advisory instead (see SECURITY.md).
        `PICOGIT_TRACE=1` output contains no tokens, but please read it before pasting.
  - type: input
    id: version
    attributes:
      label: picogit version
      description: Output of `picogit --version`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was picogit installed?
      options:
        - Release binary
        - OpenWrt package
        - Built from source
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Device and system
      description: Device model, firmware, and the output of `uname -a` (and `cat /proc/cpuinfo | head -20` for crashes)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: The exact command, its output, and the git host (GitHub, GitLab, Gitea, ...)
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Trace
      description: The same command with `PICOGIT_TRACE=1` (optional, but very helpful for network problems)
      render: text
