name: release

# Builds and publishes a release when a vX.Y.Z tag is pushed. Deliberately
# no caches: every input is downloaded and checked against deps.mk.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user openssl python3

      - name: Build all targets
        run: |
          make -j"$(nproc)" host armv7 armv7hf aarch64 mipsel mips x86 riscv64
          make sizes

      - name: Checks
        run: |
          make check-size
          sh tools/check-openwrt-package.sh
          make test
          make test-armv7
          make test-qemu-x86
          make test-qemu-riscv64

      - name: Collect release files
        run: |
          mkdir -p dist
          for t in armv7 armv7hf aarch64 mipsel mips x86 riscv64; do
            cp build/$t/picogit dist/picogit-linux-$t
          done
          cp build/host/picogit dist/picogit-linux-x86_64
          make dist
          (cd dist && sha256sum picogit-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: picogit-release
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: picogit-release
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
